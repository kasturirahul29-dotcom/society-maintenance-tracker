services:
  postgres:
    image: postgres:16-alpine
    container_name: atrium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atrium
      POSTGRES_PASSWORD: atrium
      POSTGRES_DB: atrium
    ports:
      - "5432:5432"
    volumes:
      - atrium_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atrium -d atrium"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  atrium_pgdata:
